x-shared-env: &shared-env
  AUTH_ENABLED: "false"
  AUTH_MODE: keycloak
  AUTH_KEYCLOAK_URL: http://keycloak:8080
  AUTH_KEYCLOAK_REALM: testmaster
  AUTH_KEYCLOAK_CLIENT_ID: testmaster-app
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_DEFAULT: "120/minute"
  RATE_LIMIT_STORAGE: "redis://redis:6379"

services:
  # ── Infrastructure ────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: aitp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: aitp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aitp-keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=8080
      - KC_HEALTH_ENABLED=true
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/testmaster-realm.json:/opt/keycloak/data/import/testmaster-realm.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: aitp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - core
      - generator-v2
      - testcase-migration
      - git
      - orchestrator-v2
    networks:
      - app-network

  # ── Backend services ──────────────────────────────────────────────────
  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: aitp
      PLAYWRIGHT_MCP_URL: http://playwright-mcp-agent:3000
      AUTH_PUBLIC_PATHS: "/health,/docs,/redoc,/openapi.json,/auth/login,/auth/register,/auth/settings,/videos,/automations/*/video"
      <<: *shared-env
    ports:
      - "8001:8000"
    restart: unless-stopped
    volumes:
      - automation_videos:/videos
    depends_on:
      - mongo
      - redis
      - keycloak
      - playwright-mcp-agent
    networks:
      - app-network

  testcase-migration:
    build:
      context: .
      dockerfile: services/testcase-migration/Dockerfile
    environment:
      TESTCASES_SERVICE_URL: http://core:8000
      GENERATOR_SERVICE_URL: http://generator-v2:8000
      AUTOMATIONS_SERVICE_URL: http://core:8000
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_TOP_P: ${LLM_TOP_P:-1}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      MIGRATION_REQUIREMENT_ID: unlinked
      <<: *shared-env
    ports:
      - "8009:8000"
    restart: unless-stopped
    depends_on:
      - core
      - generator-v2
      - redis
      - keycloak
    networks:
      - app-network

  git:
    build:
      context: .
      dockerfile: services/git/Dockerfile
    environment:
      WORKSPACE_DIR: /workspace
      SSH_KEYS_DIR: /ssh-keys
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      AZURE_DEVOPS_TOKEN: ${AZURE_DEVOPS_TOKEN:-}
      AZURE_DEVOPS_ORG: ${AZURE_DEVOPS_ORG:-}
      <<: *shared-env
    ports:
      - "8007:8000"
    restart: unless-stopped
    volumes:
      - git_workspace:/workspace
      - git_ssh_keys:/ssh-keys
    depends_on:
      - redis
      - keycloak
    networks:
      - app-network

  # ── PinchTab (browser control for AI agents) ───────────────────────────
  pinchtab:
    image: pinchtab/pinchtab:latest
    container_name: pinchtab
    ports:
      - "9867:9867"
    environment:
      PINCHTAB_CONFIG: /data/config.json
    volumes:
      - ./pinchtab/config.json:/data/config.json:ro
      - pinchtab_data:/data
      - automation_videos:/videos
    shm_size: "2g"
    security_opt:
      - seccomp=unconfined
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pinchtab", "health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Playwright MCP (kept for automation execution) ────────────────────
  playwright-mcp-core-1:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: playwright-mcp-core-1
    user: "0:0"
    entrypoint: ["node"]
    command:
      - cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --host
      - 0.0.0.0
      - --port
      - "8931"
      - --output-dir
      - /videos
      - --save-video=1280x720
      - --allowed-hosts
      - "*"
    ports:
      - "8931:8931"
    volumes:
      - automation_videos:/videos
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8931/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  playwright-mcp-agent:
    build:
      context: .
      dockerfile: services/playwright-mcp-agent/Dockerfile
    container_name: playwright-mcp-agent
    ports:
      - "3000:3000"
    volumes:
      - automation_videos:/videos
    environment:
      - VIDEO_PATH=/videos
      - PORT=3000
      # Playwright MCP core URL
      - PLAYWRIGHT_MCP_POOL=http://playwright-mcp-core-1:8931/mcp
      - PLAYWRIGHT_MCP_OFFICIAL_URL=http://playwright-mcp-core-1:8931/mcp
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - playwright-mcp-core-1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw 1;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/jsconfig.json:/app/jsconfig.json
    depends_on:
      - core
      - generator-v2
      - keycloak
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
      - VITE_KEYCLOAK_URL=http://localhost:8080
      - VITE_KEYCLOAK_REALM=testmaster
      - VITE_KEYCLOAK_CLIENT_ID=testmaster-app
    networks:
      - app-network

  # ── v2 Services — LangChain + LangGraph ────────────────────────────
  orchestrator-v2:
    build:
      context: .
      dockerfile: services/orchestrator-v2/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: aitp
      REQUIREMENTS_SERVICE_URL: http://core:8000
      TESTCASES_SERVICE_URL: http://core:8000
      GENERATOR_SERVICE_URL: http://generator-v2:8000
      RELEASES_SERVICE_URL: http://core:8000
      AUTOMATIONS_SERVICE_URL: http://core:8000
      EXECUTIONS_SERVICE_URL: http://core:8000
      <<: *shared-env
    ports:
      - "8011:8000"
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    networks:
      - app-network

  generator-v2:
    build:
      context: .
      dockerfile: services/generator-v2/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: aitp
      REQUIREMENTS_SERVICE_URL: http://core:8000
      TESTCASES_SERVICE_URL: http://core:8000
      RELEASES_SERVICE_URL: http://core:8000
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_TOP_P: ${LLM_TOP_P:-1}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      AUTOMATIONS_SERVICE_URL: http://core:8000
      PLAYWRIGHT_MCP_URL: http://playwright-mcp-agent:3000
      ORCHESTRATOR_SERVICE_URL: http://orchestrator-v2:8000
      PLAYWRIGHT_MCP_CORE_URL: http://playwright-mcp-core-1:8931/mcp
      PINCHTAB_URL: http://pinchtab:9867
      GIT_SERVICE_URL: http://git:8000
      <<: *shared-env
    ports:
      - "8013:8000"
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
      - core
      - git
      - playwright-mcp-core-1
      - pinchtab
    networks:
      - app-network


volumes:
  mongo_data:
  automation_videos:
  git_workspace:
  git_ssh_keys:
  redis_data:
  pinchtab_data:

networks:
  app-network:
    driver: bridge
