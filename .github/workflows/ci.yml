name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python backend lint + test ──────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - requirements
          - testcases
          - generator
          - releases
          - executions
          - automations
          - orchestrator
          - git

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check services/${{ matrix.service }}/main.py shared/

      - name: Run tests
        if: ${{ hashFiles(format('services/{0}/tests/', matrix.service)) != '' }}
        run: pytest services/${{ matrix.service }}/tests/ -v
        env:
          MONGO_URL: mongodb://localhost:27017/
          PYTHONPATH: .

  # ── Frontend lint + build ───────────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_REQUIREMENTS_URL: http://localhost:8001
          VITE_TESTCASES_URL: http://localhost:8002
          VITE_GENERATOR_URL: http://localhost:8013
          VITE_RELEASES_URL: http://localhost:8004
          VITE_EXECUTIONS_URL: http://localhost:8005
          VITE_AUTOMATIONS_URL: http://localhost:8006
          VITE_GIT_URL: http://localhost:8007
          VITE_ORCHESTRATOR_URL: http://localhost:8011
          VITE_KEYCLOAK_URL: http://localhost:8080
          VITE_KEYCLOAK_REALM: testmaster
          VITE_KEYCLOAK_CLIENT_ID: testmaster-app

  # ── Docker build check ──────────────────────────────────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aitp-frontend:ci
