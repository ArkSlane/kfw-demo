worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Upstream pools (one per backend service) ─────────────────────────

    upstream core {
        server core:8000;
    }
    upstream generator {
        server generator-v2:8000;
    }
    upstream testcase-migration {
        server testcase-migration:8000;
    }
    upstream git {
        server git:8000;
    }
    upstream orchestrator {
        server orchestrator-v2:8000;
    }

    # ── Shared proxy settings ────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        # ── API routes ───────────────────────────────────────────────────
        location /api/requirements/ {
            proxy_pass http://core/requirements/;
        }
        location /api/testcases/ {
            proxy_pass http://core/testcases/;
        }
        location /api/generator/ {
            proxy_pass http://generator/;
        }
        location /api/releases/ {
            proxy_pass http://core/releases/;
        }
        location /api/executions/ {
            proxy_pass http://core/executions/;
        }
        location /api/automations/ {
            proxy_pass http://core/automations/;
        }
        location /api/testcase-migration/ {
            proxy_pass http://testcase-migration/;
        }
        location /api/toabrkia/ {
            proxy_pass http://core/;
        }
        location /api/git/ {
            proxy_pass http://git/;
        }
        location /api/orchestrator/ {
            proxy_pass http://orchestrator/;
        }

        # ── Frontend (default) ───────────────────────────────────────────
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
